const speakerRef = React.createRef(); speakerRef.current = false;
function pickKoreanVoice(){
  const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  let v = vs.find(x=>x.lang==='ko-KR' && x.name.toLowerCase().includes('google') && !x.localService);
  if(!v) v = vs.find(x=>/ko-KR/.test(x.lang) && /wavenet|neural2?/i.test(x.name));
  if(!v) v = vs.find(x=>/ko-KR/.test(x.lang) && /wavenet|neural|premium|enhanced|natural/i.test(x.name));
  if(!v) v = vs.find(x=>x.lang==='ko-KR' && x.name.toLowerCase().includes('google'));
  if(!v) v = vs.find(x=>x.lang==='ko-KR');
  return v;
}
function speak(text,opts={}){
  if(!speakerRef.current || !window.speechSynthesis) return;
  const synth = window.speechSynthesis;
  if(synth.speaking) synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickKoreanVoice(); if(v) u.voice=v;
  u.lang='ko-KR'; u.rate=opts.rate||0.95; u.pitch=opts.pitch||1.0;
  if(opts.onboundary) u.onboundary=opts.onboundary;
  if(opts.onend) u.onend=opts.onend;
  synth.speak(u);
}

// AudioBuffer → WAV blob (Tone.Player에 안전하게 전달하기 위함)
function audioBufferToWavBlob(buffer){
  const numCh = buffer.numberOfChannels;
  const sr = buffer.sampleRate;
  const len = buffer.length;
  const dataSize = len * numCh * 2;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);
  let p = 0;
  const ws = s => { for(let i=0;i<s.length;i++) view.setUint8(p++, s.charCodeAt(i)); };
  const w32 = v => { view.setUint32(p,v,true); p+=4; };
  const w16 = v => { view.setUint16(p,v,true); p+=2; };
  ws('RIFF'); w32(36+dataSize); ws('WAVE');
  ws('fmt '); w32(16); w16(1); w16(numCh); w32(sr);
  w32(sr*numCh*2); w16(numCh*2); w16(16);
  ws('data'); w32(dataSize);
  const chs = [];
  for(let c=0; c<numCh; c++) chs.push(buffer.getChannelData(c));
  for(let i=0; i<len; i++){
    for(let c=0; c<numCh; c++){
      const s = Math.max(-1, Math.min(1, chs[c][i]));
      view.setInt16(p, s<0 ? s*0x8000 : s*0x7FFF, true);
      p += 2;
    }
  }
  return new Blob([ab], {type:'audio/wav'});
}

// 여러 녹음을 하나의 WAV로 이어붙이기 (최종 작품)
async function concatTakes(takes){
  if(!takes || takes.length===0) return null;
  let ctx = null;
  try{
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buffers = [];
    for(const t of takes){
      const blob = await fetch(t.url).then(r=>r.blob());
      const arr = await blob.arrayBuffer();
      const buf = await ctx.decodeAudioData(arr.slice(0));
      buffers.push(buf);
    }
    const sr = buffers[0].sampleRate;
    const numCh = Math.max(...buffers.map(b=>b.numberOfChannels));
    const gapSamples = Math.floor(sr * 0.3); // 0.3초 간격
    const totalLen = buffers.reduce((s,b)=>s+b.length,0) + gapSamples*(buffers.length-1);
    const merged = ctx.createBuffer(numCh, totalLen, sr);
    let offset = 0;
    buffers.forEach((buf,idx)=>{
      for(let ch=0; ch<numCh; ch++){
        const src = buf.numberOfChannels>ch ? buf.getChannelData(ch) : buf.getChannelData(0);
        merged.copyToChannel(src, ch, offset);
      }
      offset += buf.length;
      if(idx<buffers.length-1) offset += gapSamples;
    });
    const wavBlob = audioBufferToWavBlob(merged);
    ctx.close();
    return {url: URL.createObjectURL(wavBlob), blob: wavBlob};
  }catch(e){
    console.warn('concatTakes 실패:', e);
    if(ctx){ try{ctx.close();}catch(_){} }
    return null;
  }
}

// 녹음 무음 잘라내기: 앞 무음 제거 + 짧게 사용
// 학생이 버튼 누르고 → 잠시 후 소리 내는 딜레이를 자동 제거
// 결과를 WAV blob URL로 반환 (Tone.Player 컨텍스트와 호환되게)
async function trimSilence(blob){
  let ctx = null;
  try{
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const arr = await blob.arrayBuffer();
    const buf = await ctx.decodeAudioData(arr.slice(0)); // slice로 detached buffer 방지
    const data = buf.getChannelData(0);
    const sr = buf.sampleRate;

    // 시작점: |sample| > 0.015 인 첫 지점 (앞 0.02초 마진 포함)
    const threshold = 0.015;
    let start = 0;
    let found = false;
    for(let i=0; i<data.length; i++){
      if(Math.abs(data[i]) > threshold){
        start = Math.max(0, i - Math.floor(sr * 0.02));
        found = true;
        break;
      }
    }
    if(!found){ ctx.close(); return null; } // 무음

    // 시작점부터 0.8초 (짧은 타악음 + 약간의 여운)
    const maxLen = Math.floor(sr * 0.8);
    const end = Math.min(start + maxLen, data.length);
    if(end - start < sr * 0.05){ ctx.close(); return null; }

    const trimmed = ctx.createBuffer(buf.numberOfChannels, end - start, sr);
    for(let ch=0; ch<buf.numberOfChannels; ch++){
      const src = buf.getChannelData(ch).subarray(start, end);
      trimmed.copyToChannel(src, ch);
    }
    // WAV blob URL로 반환 → Tone.Player가 자체 컨텍스트에서 디코드
    const wavBlob = audioBufferToWavBlob(trimmed);
    ctx.close();
    return URL.createObjectURL(wavBlob);
  }catch(e){
    console.warn('trimSilence 실패:', e);
    if(ctx){ try{ctx.close();}catch(_){} }
    return null;
  }
}

function SpeakText({text}){
  const [idx,setIdx]=useState(-1);
  return (
    <div className="flex items-center gap-3">
      <span className="t-mid">{text.split('').map((c,i)=><span key={i} className={i<idx?'char-on':''}>{c}</span>)}</span>
      <button className="btn bg-indigo-400 text-white px-4 py-2 t-sm"
        onClick={()=>{ setIdx(0); speak(text,{onboundary:e=>setIdx(e.charIndex), onend:()=>setIdx(text.length)});
          if(!speakerRef.current) setIdx(-1); }}>🔊 듣기</button>
    </div>
  );
}

function RecorderUI({title, examples, onComplete}){
  const [mode,setMode]=useState(null);
  const [recording,setRecording]=useState(false);
  const [text,setText]=useState('');
  const [b64,setB64]=useState('');
  const [audioUrl,setAudioUrl]=useState('');
  const [helpUsed,setHelpUsed]=useState(false);
  const [showHelp,setShowHelp]=useState(false);
  const [sticker,setSticker]=useState('');
  const [heard,setHeard]=useState(false);
  const [silent,setSilent]=useState(false);
  const [blobSize,setBlobSize]=useState(0);
  const mr=useRef(null), chunks=useRef([]), sr=useRef(null);
  const textRef=useRef('');

  const startRec = async ()=>{
    chunks.current=[];
    try{
      const st = await navigator.mediaDevices.getUserMedia({audio:true});
      mr.current=new window.MediaRecorder(st);
      mr.current.ondataavailable=e=>chunks.current.push(e.data);
      mr.current.onstop=()=>{
        const blob=new Blob(chunks.current,{type:'audio/webm'});
        setBlobSize(blob.size);
        setSilent(blob.size < 8000); // 8KB 미만 = 무음 추정
        setAudioUrl(URL.createObjectURL(blob));
        const reader=new FileReader();
        reader.onloadend=()=>setB64(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
        st.getTracks().forEach(t=>t.stop());
      };
      mr.current.start(); setRecording(true); setMode('rec');
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SR){
        const s=new SR(); s.lang='ko-KR'; s.interimResults=true; s.continuous=true;
        s.onresult=e=>{ const t=Array.from(e.results).map(r=>r[0].transcript).join('');
          textRef.current=t; setText(t); };
        sr.current=s; try{s.start();}catch(e){}
      }
    }catch(e){ alert('마이크를 사용할 수 없어요. 키보드로 입력해도 괜찮아요!'); setMode('type'); }
  };
  const stopRec = ()=>{
    if(mr.current && mr.current.state==='recording') mr.current.stop();
    if(sr.current){ try{sr.current.stop();}catch(e){} }
    setRecording(false); setMode('done');
  };
  const goneToType = ()=>{ setMode('type'); setHeard(true); }; // type은 글로 직접 보니 자동 통과
  const reset = ()=>{ setMode(null); setRecording(false); setText(''); textRef.current=''; setB64(''); setAudioUrl(''); setSticker(''); setHeard(false); setSilent(false); };

  const replay = ()=>{
    if(audioUrl){
      const a = new Audio(audioUrl);
      a.onended = ()=>setHeard(true);
      a.play().catch(()=>setHeard(true));
    } else if(text){
      speak(text, {onend:()=>setHeard(true)});
      if(!speakerRef.current) setHeard(true); // 스피커 꺼져있어도 글 봤으니 OK
    }
  };

  return (
    <div className="card p-8 w-[760px] text-center fade-in">
      <h2 className="t-huge text-indigo-700 mb-4">{title}</h2>
      {mode===null && (
        <div className="flex flex-col items-center gap-4">
          <div className="flex gap-4">
            <button className="btn bg-indigo-500 text-white px-9 py-5 t-big" onClick={()=>{ Tone.start(); startRec(); }}>🎤 말로 녹음</button>
            <button className="btn bg-teal-400 text-white px-9 py-5 t-big" onClick={goneToType}>⌨️ 글자로 쓰기</button>
          </div>
          <button className="btn bg-slate-300 text-slate-600 px-7 py-3 t-mid"
            onClick={()=>onComplete({text:'',b64:'',helpUsed,sticker:'',skipped:true})}>건너뛰기 →</button>
          <div className="t-sm text-slate-500">🎤 또는 ⌨️ 를 골라요</div>
        </div>
      )}
      {mode==='rec' && (
        <div className="flex flex-col items-center gap-3">
          <button onClick={stopRec} className="w-36 h-36 rounded-full bg-rose-400 flex items-center justify-center text-7xl float">⏹</button>
          <div className="t-big text-rose-500">녹음 중! 다 말하면 ⏹</div>
          <div className="t-mid text-slate-500 min-h-[40px] px-6">{text||'…'}</div>
        </div>
      )}
      {mode==='type' && (
        <div className="flex flex-col items-center gap-4">
          <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="여기에 내 생각을 써 봐요"
            className="w-full h-32 p-4 t-mid rounded-3xl border-4 border-indigo-200 outline-none focus:border-indigo-400"/>
          <button className="btn bg-indigo-500 text-white px-9 py-4 t-big" onClick={()=>{setMode('done'); setHeard(true);}} disabled={!text.trim()}>다 썼어요 ✓</button>
        </div>
      )}
      {mode==='done' && (
        <div className="flex flex-col items-center gap-4">
          <div className="w-24 h-24 rounded-full bg-emerald-400 flex items-center justify-center text-6xl pop">✅</div>
          {silent && audioUrl && (
            <div className="bg-rose-100 text-rose-700 px-4 py-3 rounded-2xl t-mid">
              ⚠️ 소리가 거의 안 들려요!<br/>🔁 다시 녹음해 보세요
            </div>
          )}
          {text && <div className="card p-3 w-full t-mid text-slate-600 bg-white/70">"{text}"</div>}
          <div className="flex gap-3 justify-center">
            {(audioUrl||text) && (
              <button className={"btn px-7 py-3 t-mid text-white "+(!heard?'bg-amber-500 animate-pulse':'bg-violet-400')}
                onClick={replay}>
                {!heard?'먼저 ▶ 들어보기':'▶ 다시 들어보기'}
              </button>
            )}
            <button className="btn bg-amber-300 text-amber-900 px-7 py-3 t-mid" onClick={reset}>🔁 다시 하기</button>
          </div>
          {heard && <StickerPick value={sticker} onPick={setSticker}/>}
          <button className="btn bg-indigo-600 text-white px-10 py-4 t-big" disabled={!heard || !sticker}
            onClick={()=>{ confetti(); fx.yay(); onComplete({text,b64,helpUsed,sticker,skipped:false}); }}>
            {!heard?'먼저 ▶ 들어보기 눌러요':
             !sticker?'스티커를 골라요':
             '다음으로 →'}
          </button>
        </div>
      )}
      {mode!=='done' && (
        <div className="mt-5"><button className="btn bg-yellow-300 text-yellow-900 px-6 py-3 t-mid"
          onClick={()=>{ setShowHelp(true); setHelpUsed(true); }}>💡 도움받기 (예시 보기)</button></div>
      )}
      {showHelp && (
        <div className="modal-bg" onClick={()=>setShowHelp(false)}>
          <div className="card p-7 w-[620px]" onClick={e=>e.stopPropagation()}>
            <div className="t-big text-indigo-700 mb-3">💡 이렇게 말해볼 수 있어요</div>
            <div className="flex flex-col gap-2 mb-4">
              {examples.map((ex,i)=><div key={i} className="bg-yellow-50 rounded-2xl p-3"><SpeakText text={ex}/></div>)}
            </div>
            <button className="btn bg-indigo-500 text-white px-7 py-3 t-mid w-full" onClick={()=>setShowHelp(false)}>알겠어요! 👍</button>
          </div>
        </div>
      )}
    </div>
  );
}

function GuideModal({title, short, steps, onClose}){
  const [i,setI]=useState(0);
  useEffect(()=>{ const t=setTimeout(()=>speak(steps[0]),300); return ()=>clearTimeout(t); },[]);
  const go=(n)=>{ setI(n); speak(steps[n]); };
  const last = i>=steps.length-1;
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="card p-8 w-[660px] text-center" onClick={e=>e.stopPropagation()}>
        <div className="t-huge text-indigo-700 mb-1">💡 {title}</div>
        <div className="t-mid text-slate-400 mb-4">{short}</div>
        <div className="flex justify-center gap-2 mb-5">
          {steps.map((_,k)=>(
            <div key={k} className="rounded-full transition-all"
              style={{width:k===i?34:14,height:14, background:k===i?'#7c6cf0':(k<i?'#c4b5fd':'#e5e0f5')}}/>
          ))}
        </div>
        <div className="bg-indigo-50 rounded-3xl px-6 flex items-center justify-center mb-6" style={{minHeight:160}}>
          <span className="t-huge text-slate-700" style={{lineHeight:1.3}}>{steps[i]}</span>
        </div>
        <div className="flex gap-3 justify-center">
          {i>0 && <button className="btn bg-slate-200 text-slate-600 t-big px-7 py-3" onClick={()=>go(i-1)}>← 이전</button>}
          {!last && <button className="btn bg-indigo-500 text-white t-big px-10 py-3" onClick={()=>go(i+1)}>다음 →</button>}
          {last && <button className="btn bg-emerald-500 text-white t-big px-10 py-3" onClick={onClose}>시작할게요! 👍</button>}
        </div>
      </div>
    </div>
  );
}

function CustomSoundSlot({slot, info, previewed, onRecorded, onClear, onPreview, onRename}){
  const [recording,setRecording]=useState(false);
  const [timer,setTimer]=useState(0);
  const mr=useRef(null), chunks=useRef([]), tick=useRef(null), stream=useRef(null);
  const start = async ()=>{
    try{
      const st = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.current = st; chunks.current=[];
      mr.current=new window.MediaRecorder(st);
      mr.current.ondataavailable=e=>chunks.current.push(e.data);
      mr.current.onstop=async ()=>{
        const blob=new Blob(chunks.current,{type:'audio/webm'});
        const url=URL.createObjectURL(blob);
        st.getTracks().forEach(t=>t.stop());
        clearInterval(tick.current); setRecording(false); setTimer(0);
        await onRecorded(slot, url, blob);
      };
      mr.current.start(); setRecording(true);
      setTimer(0); tick.current=setInterval(()=>setTimer(t=>{
        if(t>=1){ if(mr.current && mr.current.state==='recording') mr.current.stop(); return t; }
        return t+1;
      }),1000);
    }catch(e){ alert('마이크를 사용할 수 없어요. 건너뛰어도 괜찮아요.'); }
  };
  const stop = ()=>{ if(mr.current && mr.current.state==='recording') mr.current.stop(); };
  return (
    <div className="card p-5 w-[320px] flex flex-col items-center gap-3">
      <InstIcon type={slot} size={64}/>
      <input type="text" value={info?.name || CUSTOM_DEFAULT_NAMES[slot]}
        onChange={e=>onRename(slot, e.target.value)}
        placeholder={CUSTOM_DEFAULT_NAMES[slot]}
        className="w-full t-mid text-center rounded-2xl bg-white/70 border-2 border-indigo-200 px-3 py-2 outline-none focus:border-indigo-400"/>
      {!info && !recording && (
        <button onClick={start} className="btn bg-indigo-500 text-white px-7 py-3 t-mid">🎤 녹음 시작</button>
      )}
      {recording && (
        <>
          <div className="w-20 h-20 rounded-full rec flex items-center justify-center text-4xl text-white">{2-timer}</div>
          <button onClick={stop} className="btn bg-rose-500 text-white px-6 py-2 t-mid">⏹ 끝</button>
        </>
      )}
      {info && !recording && (
        <>
          {info.silent && (
            <div className="bg-rose-100 text-rose-700 px-3 py-2 rounded-xl t-sm text-center w-full" style={{lineHeight:1.3}}>
              ⚠️ 소리가 안 들렸어요!<br/>🔁 다시 녹음해요
            </div>
          )}
          <div className="flex gap-2">
            <button onClick={()=>onPreview(slot)}
              className={"btn px-5 py-2 t-sm "+(!previewed?'bg-amber-300 text-amber-900 animate-pulse':'bg-violet-400 text-white')}>
              {!previewed?'먼저 ▶ 들어보기':'▶ 다시 듣기'}
            </button>
            <button onClick={()=>onClear(slot)} className="btn bg-amber-300 text-amber-900 px-5 py-2 t-sm">🔁 다시</button>
          </div>
        </>
      )}
      {!info && !recording && (
        <div className="t-sm text-slate-400 text-center">짧은 소리 한 번만!<br/>(박수 · '탁' · 책상 톡)</div>
      )}
    </div>
  );
}

function RuleCard({rp, bpm, selected, onSelect, onListen}){
  const [vStep,setVStep] = useState(-1);
  const [visualizing,setVisualizing] = useState(false);
  const playVisual = async ()=>{
    onSelect();
    setVisualizing(true);
    const beat = 60/bpm/2 * 1000;
    for(let i=0;i<8;i++){
      setVStep(i);
      await new Promise(r=>setTimeout(r,beat));
    }
    setVStep(-1); setVisualizing(false);
  };
  return (
    <div className={"card p-4 w-[240px] flex flex-col items-center gap-2 transition-transform "+
      (selected?'ring-8 ring-indigo-300 scale-105':'')}>
      <div className="t-big text-indigo-700">{rp.label}</div>
      <div className="flex gap-1 justify-center">
        {rp.pattern.map((v,i)=>{
          const isNow = vStep===i;
          const bg = isNow ? (v?'#7c6cf0':'#fcd34d') : (v?'#a5b4fc':'#e5e0f5');
          return <div key={i} style={{width:20,height:20,borderRadius:6,background:bg,
            transform:isNow?'scale(1.4)':'scale(1)',transition:'all .1s'}}/>;
        })}
      </div>
      <div className="t-xs text-slate-500">{rp.desc}</div>
      <div className="flex flex-col gap-2 w-full">
        <button onClick={playVisual} disabled={visualizing}
          className="btn bg-yellow-300 text-yellow-900 px-3 py-2 t-sm w-full">
          {visualizing?'박수! 따라 쳐요':'👏 박수로 먼저'}
        </button>
        <button onClick={()=>{ onSelect(); onListen(rp); }}
          className="btn bg-indigo-500 text-white px-3 py-2 t-sm w-full">🥁 들어보기</button>
      </div>
    </div>
  );
}

/* =====================================================
   메인 앱
   ===================================================== */
function App(){
  const [view,setView]=useState('login');
  const [students,setStudents]=useState([]);
  const [student,setStudent]=useState(null);
  const [speakerOn,setSpeakerOn]=useState(false);

  const [mode,setMode]=useState(null);

  const [situation,setSituation]=useState(null);
  const [bpm,setBpm]=useState(100);

  const [stage,setStage]=useState(1);
  const [timeSig,setTimeSig]=useState(4);
  const COLS = timeSig===4 ? 8 : 6;
  const newGrid = (cols)=>[Array(cols).fill(null),Array(cols).fill(null),Array(cols).fill(null)];
  const [grid,setGrid]=useState(()=>newGrid(8));
  const [selectedInst,setSelectedInst]=useState('drum');
  const [isPlaying,setIsPlaying]=useState(false);
  const [step,setStep]=useState(-1);
  const [musicTakes,setMusicTakes]=useState([]);
  const [isMusicRec,setIsMusicRec]=useState(false);
  const [showGuide,setShowGuide]=useState(false);
  const [feedback,setFeedback]=useState('');

  const [chosenRule,setChosenRule]=useState(null);
  const [favorites,setFavorites]=useState([]);
  const [favoriteWhy,setFavoriteWhy]=useState('');
  const [pairA,setPairA]=useState(null);
  const [pairB,setPairB]=useState(null);
  const [pairTried,setPairTried]=useState([]);
  const [finalWork,setFinalWork]=useState(null);
  const [groupWorks,setGroupWorks]=useState([]);
  const [loadingGroup,setLoadingGroup]=useState(false);
  const [building,setBuilding]=useState(false);
  const [customSounds,setCustomSounds]=useState({my1:null,my2:null});
  const [previewed,setPreviewed]=useState({my1:false,my2:false});
  const [musicHeard,setMusicHeard]=useState(false);

  const [reflection,setReflection]=useState([]);
  const [session,setSession]=useState({});

  const synths=useRef({}), loop=useRef(null), gridRef=useRef(grid), recorder=useRef(null);
  const players=useRef({my1:null,my2:null});
  const loopCount=useRef(0), lastCol=useRef(-1);

  useEffect(()=>{
    const fit=()=>{
      const s=Math.min(window.innerWidth/1280, window.innerHeight/800);
      const stg=document.getElementById('stage');
      stg.style.transform=`scale(${s})`;
      stg.style.left=`${(window.innerWidth-1280*s)/2}px`;
      stg.style.top=`${(window.innerHeight-800*s)/2}px`;
    };
    fit(); window.addEventListener('resize',fit);
    return ()=>window.removeEventListener('resize',fit);
  },[]);

  useEffect(()=>{ speakerRef.current=speakerOn; },[speakerOn]);
  useEffect(()=>{ gridRef.current=grid; },[grid]);
  useEffect(()=>{ Tone.Transport.bpm.value=bpm; },[bpm]);

  // 모드별 배경
  useEffect(()=>{
    if(mode && view!=='login' && view!=='mode'){
      document.body.style.background = mode.bgGradient;
      document.body.style.backgroundAttachment = 'fixed';
    } else {
      document.body.style.background = '';
    }
  },[mode, view]);

  useEffect(()=>{
    api.getStudents().then(r=>{ if(r.ok && r.students) setStudents(r.students); });

    synths.current={
      drum:new Tone.MembraneSynth({pitchDecay:0.05,octaves:4,envelope:{attack:0.001,decay:0.3,sustain:0.01}}).toDestination(),
      triangle:new Tone.FMSynth({harmonicity:1.5,modulationIndex:12,oscillator:{type:'sine'},envelope:{attack:0.001,decay:0.8,sustain:0,release:0.8}}).toDestination(),
      tambourine:new Tone.MetalSynth({frequency:280,envelope:{attack:0.001,decay:0.25,release:0.1},harmonicity:5.1,modulationIndex:32,resonance:4000,octaves:1.5}).toDestination(),
      castanets:new Tone.MembraneSynth({pitchDecay:0.001,octaves:0.1,envelope:{attack:0.001,decay:0.05,sustain:0}}).toDestination(),
    };
    synths.current.tambourine.volume.value = 8;
    synths.current.triangle.volume.value = -2;

    recorder.current=new Tone.Recorder();
    Tone.getDestination().connect(recorder.current);

    return ()=>{
      Object.values(synths.current).forEach(s=>s&&s.dispose());
      Object.values(players.current).forEach(p=>p&&p.dispose());
      if(loop.current){ try{loop.current.dispose();}catch(e){} }
    };
  },[]);

  // 박자 변경 시 시퀀스 재생성 (4박자=8칸, 3박자=6칸)
  useEffect(()=>{
    if(loop.current){ try{loop.current.dispose();}catch(e){} }
    const cols = timeSig===4 ? 8 : 6;
    const seq = Array.from({length:cols},(_,i)=>i);
    loop.current=new Tone.Sequence((time,col)=>{
      if(lastCol.current===cols-1 && col===0){
        loopCount.current++;
        if(loopCount.current>=2){
          Tone.Draw.schedule(()=>{
            Tone.Transport.stop(); loop.current.stop();
            setIsPlaying(false); setStep(-1);
            setFeedback('🎵 두 번 들었어요! 다시 듣거나, 수정해봐요.');
          },time);
          lastCol.current=-1; loopCount.current=0;
          return;
        }
      }
      lastCol.current = col;
      Tone.Draw.schedule(()=>setStep(col),time);
      let cnt=0;
      gridRef.current.forEach(row=>{
        const id=row[col];
        if(id){ cnt++; playOne(id,time); }
      });
      Tone.Draw.schedule(()=>{
        if(cnt>1) setFeedback('✨ 여러 악기가 함께! 소리가 풍부해져요!');
        else if(cnt===1) setFeedback('🎶 멋진 소리가 나고 있어요!');
      },time);
    },seq,'8n');
  },[timeSig]);

  const playOne = (id, time)=>{
    if(id==='my1'||id==='my2'){
      const p = players.current[id];
      if(p && p.loaded){
        try{
          // 트림 단계에서 이미 0.6초로 잘렸으니 그대로 재생
          // (Tone.Player는 같은 player에 다시 start 호출되면 자동으로 이전 재생 정지)
          p.start(time);
        }catch(e){}
      }
      return;
    }
    const sy = synths.current[id]; if(!sy) return;
    if(id==='triangle') sy.triggerAttackRelease('C8','16n',time);
    else if(id==='tambourine') sy.triggerAttackRelease('16n',time);
    else if(id==='castanets') sy.triggerAttackRelease('C5','32n',time);
    else sy.triggerAttackRelease('C2','8n',time);
  };

  useEffect(()=>{ if(view==='stage') setShowGuide(true); },[view,stage]);

  const trigger=async(id)=>{
    await Tone.start();
    if(id==='my1'||id==='my2'){
      const p = players.current[id];
      if(p && p.loaded){
        try{ p.start(); }catch(e){}
      }
      return;
    }
    const sy=synths.current[id]; if(!sy) return;
    if(id==='triangle') sy.triggerAttackRelease('C8','16n');
    else if(id==='tambourine') sy.triggerAttackRelease('16n');
    else if(id==='castanets') sy.triggerAttackRelease('C5','32n');
    else sy.triggerAttackRelease('C2','8n');
  };

  const playPreset = async (pattern, instId='drum', useBpm=null)=>{
    await Tone.start();
    const t0 = Tone.now();
    const beat = 60 / (useBpm||bpm) / 2;
    pattern.forEach((v,i)=>{ if(v) playOne(instId, t0 + i*beat); });
  };

  // 박자 비교 청취용 — 4박 또는 3박에 맞춰 짧게 들려줌
  const playBeatPattern = async (useBpm=null, ts=null)=>{
    const cols = (ts||timeSig)===4 ? 8 : 6;
    const ptn = Array(cols).fill(1);
    return playPreset(ptn,'drum',useBpm);
  };

  const playPair = async (a,b)=>{
    if(!a||!b) return;
    await Tone.start();
    // 시도 기록
    const key = [a,b].sort().join('+');
    setPairTried(prev=>prev.includes(key)?prev:[...prev,key]);
    const t0 = Tone.now();
    const beat = 60/bpm/2;
    for(let i=0;i<8;i++){
      const time = t0 + i*beat;
      playOne(a, time);
      if(a!==b) playOne(b, time);
    }
  };

  const onRecordedSound = async (slot, url, blob)=>{
    if(players.current[slot]){ try{ players.current[slot].dispose(); }catch(e){} }
    setPreviewed(p=>({...p, [slot]:false})); // 새 녹음 → 들어보기 리셋

    // 무음 트림 시도 → WAV URL 반환
    const trimmedUrl = await trimSilence(blob);

    let silent = false;
    const targetUrl = trimmedUrl || url;
    if(!trimmedUrl) silent = true;

    // Tone.Player에 URL 전달 → Tone.js가 자체 컨텍스트에서 디코드 (컨텍스트 일치)
    const player = new Tone.Player(targetUrl).toDestination();
    await Tone.loaded();
    players.current[slot] = player;
    setCustomSounds(p=>({...p, [slot]: {url, name: p[slot]?.name||CUSTOM_DEFAULT_NAMES[slot], silent}}));
  };
  const onClearSound = (slot)=>{
    if(players.current[slot]){ try{ players.current[slot].dispose(); }catch(e){} players.current[slot]=null; }
    setCustomSounds(p=>({...p, [slot]: null}));
    setGrid(g=>g.map(row=>row.map(c=>c===slot?null:c)));
    if(selectedInst===slot) setSelectedInst('drum');
  };
  const onPreviewSound = async (slot)=>{
    await Tone.start();
    const p = players.current[slot];
    if(p && p.loaded){ try{ p.stop(); p.start(); }catch(e){} }
    setPreviewed(prev=>({...prev, [slot]:true}));
  };
  const onRenameSound = (slot, name)=>{
    setCustomSounds(p=>({...p, [slot]: p[slot]?{...p[slot], name}:{name, url:null}}));
  };

  const getInstObj = (id)=>{
    if(id==='my1'||id==='my2') return {id, name:customSounds[id]?.name||CUSTOM_DEFAULT_NAMES[id], color:CUSTOM_COLORS[id], timbre:CUSTOM_TIMBRE, custom:true};
    return INSTRUMENTS.find(i=>i.id===id);
  };

  const visibleInstruments = (forStage)=>{
    if(forStage===1) return [INSTRUMENTS[0]];
    if(forStage===2) return INSTRUMENTS;
    const customs = [];
    if(customSounds.my1?.url) customs.push(getInstObj('my1'));
    if(customSounds.my2?.url) customs.push(getInstObj('my2'));
    if(favorites.length===0) return [...INSTRUMENTS, ...customs];
    const chosen = favorites.map(id=>INSTRUMENTS.find(i=>i.id===id)).filter(Boolean);
    return [...chosen, ...customs];
  };

  const handleCell=async(r,c)=>{
    await Tone.start();
    const ng=grid.map(row=>[...row]);
    if(stage===1){
      if(r!==0) return;
      if(ng[0][c]){ ng[0][c]=null; } else { ng[0][c]='drum'; trigger('drum'); }
    } else if(stage===2){
      if(r!==0) return;
      if(ng[0][c]){ ng[0][c]=null; } else { ng[0][c]=selectedInst; trigger(selectedInst); }
    } else {
      if(ng[r][c]===selectedInst){ ng[r][c]=null; }
      else { ng[r][c]=selectedInst; trigger(selectedInst); }
    }
    setGrid(ng);
  };

  const swapAllInstrument=(id)=>{
    setSelectedInst(id); trigger(id);
    setGrid(g=>{ const ng=g.map(r=>[...r]); ng[0]=ng[0].map(c=>c?id:null); return ng; });
    setFeedback(`${getInstObj(id).name}(으)로 바꿨어요! 느낌이 어떤가요?`);
  };

  const play=async()=>{
    await Tone.start();
    if(!isPlaying){
      loopCount.current=0; lastCol.current=-1;
      Tone.Transport.start(); loop.current.start(0); setIsPlaying(true);
      setFeedback('전체 음악을 두 번 들려드릴게요!');
    } else {
      Tone.Transport.stop(); loop.current.stop(); setIsPlaying(false); setStep(-1);
      setFeedback('멈췄어요. 빈 칸을 눌러 바꿔봐요.');
    }
  };
  const stopAll = ()=>{ Tone.Transport.stop(); if(loop.current) loop.current.stop(); setIsPlaying(false); setStep(-1); };

  const musicRec=async()=>{
    await Tone.start();
    if(!isMusicRec){
      recorder.current.start(); setIsMusicRec(true);
      if(!isPlaying) play();
      setFeedback('🔴 음악 녹음 중!');
    } else {
      setIsMusicRec(false);
      const rec=await recorder.current.stop();
      const url=URL.createObjectURL(rec);
      const reader=new FileReader();
      reader.onloadend=async()=>{
        const b64=reader.result.split(',')[1];
        setMusicTakes(p=>[...p,{url,b64}]);
        setMusicHeard(false); // 새 녹음 → 들어보기 리셋
        const takeNum = musicTakes.length+1;
        const res=await api.saveRecording({studentName:student.name,phase:'music'+takeNum,audioBase64:b64,mimeType:'audio/webm'});
        if(res.ok) setSession(p=>({...p,['music'+takeNum+'Url']:res.fileUrl}));
      };
      reader.readAsDataURL(rec);
      confetti(); fx.yay();
      setFeedback('✅ 음악이 저장되었어요! 먼저 ▶ 내 녹음 듣기를 눌러봐요');
    }
  };

  const playJoined = ()=>{
    if(musicTakes.length<1) return;
    setMusicHeard(true);
    const audios = musicTakes.map(t=>new Audio(t.url));
    let idx = 0;
    const playNext = ()=>{
      if(idx>=audios.length) return;
      const a = audios[idx];
      a.onended = ()=>{ idx++; playNext(); };
      a.play();
    };
    playNext();
  };

  // 최종 작품 만들기 — 여러 녹음을 하나의 WAV로 이어붙이고 저장
  const makeFinalWork = async ()=>{
    if(musicTakes.length<2){ setFeedback('🎬 최종 작품은 음악 녹음 2개 이상이어야 만들 수 있어요'); return; }
    setBuilding(true);
    setFeedback('🎬 최종 작품을 만들고 있어요...');
    const result = await concatTakes(musicTakes);
    if(!result){
      setFeedback('❌ 최종 작품 만들기 실패');
      setBuilding(false);
      return;
    }
    setFinalWork(result.url);
    // GAS에 저장
    const reader = new FileReader();
    reader.onloadend = async ()=>{
      const b64 = reader.result.split(',')[1];
      const res = await api.saveRecording({studentName:student.name, phase:'final', audioBase64:b64, mimeType:'audio/wav'});
      if(res.ok) setSession(p=>({...p, finalWorkUrl: res.fileUrl}));
    };
    reader.readAsDataURL(result.blob);
    setBuilding(false);
    confetti(); fx.yay();
    setFeedback('🎬 최종 작품이 완성되었어요! 다운로드도 가능해요');
  };

  const downloadFinal = ()=>{
    if(!finalWork) return;
    const a = document.createElement('a');
    a.href = finalWork;
    a.download = (student?.name||'작품')+'_최종작품.wav';
    document.body.appendChild(a); a.click(); a.remove();
  };

  const goStage=(n,opts={})=>{
    stopAll();
    setGrid(g=>{
      const ng=newGrid(COLS);
      if(n===1 && opts.applyRule){
        const rp = getRulePatterns(timeSig).find(r=>r.id===opts.applyRule);
        if(rp) rp.pattern.forEach((v,i)=>{ if(i<COLS && v) ng[0][i]='drum'; });
      } else if(n===2){
        // 기존 grid가 같은 칸 수면 유지
        if(g[0].length===COLS) ng[0]=[...g[0]];
      } else if(n===3){
        if(g[0].length===COLS) ng[0]=[...g[0]];
      }
      return ng;
    });
    if(n===1) setSelectedInst('drum');
    if(n===2) setSelectedInst(grid[0].find(x=>x)||'drum');
    if(n===3) setSelectedInst(pairA||favorites[0]||'tambourine');
    setStage(n); setView('stage');
    setFeedback(STAGE_INFO[n].short);
  };

  const goBack = ()=>{
    stopAll();
    if(view==='mode') setView('login');
    else if(view==='mySounds') setView('prerecord');
    else if(view==='situation') setView('mySounds');
    else if(view==='tempo') setView('situation');
    else if(view==='stage' && stage===1) setView('tempo');
    else if(view==='rule') { setStage(1); setView('stage'); }
    else if(view==='stage' && stage===2) setView('rule');
    else if(view==='preference') { setStage(2); setView('stage'); }
    else if(view==='pair') setView('preference');
    else if(view==='stage' && stage===3) setView('pair');
    else if(view==='reflection') { setStage(3); setView('stage'); }
    else if(view==='postrecord') setView('reflection');
    else if(view==='eval') setView('postrecord');
  };

  const pairingDescription = ()=>{
    if(!pairA||!pairB) return '';
    const a = getInstObj(pairA); const b = getInstObj(pairB);
    if(a.timbre===b.timbre) return `${a.name}와 ${b.name} — 둘 다 '${a.timbre}'의 비슷한 짝꿍이에요!`;
    return `${a.name}('${a.timbre}')와 ${b.name}('${b.timbre}') — 서로 다른 색의 만남이에요!`;
  };

  const toggleFavorite = (id)=>{
    if(favorites.includes(id)){
      setFavorites(favorites.filter(x=>x!==id));
    } else if(favorites.length<2){
      setFavorites([...favorites,id]); trigger(id);
    } else {
      setFavorites([favorites[0],id]); trigger(id);
    }
  };

      postRecordText: session.postRecordText||'', postRecordUrl: session.postRecordUrl||'',

                    <div className="t-xs opacity-70 mt-1">"{m.motto}"</div>

                <div className="t-sm text-slate-500">{p.bpm} BPM</div>

              </button>

          <div className="card p-3 w-[700px] flex flex-col items-center gap-2">

              <span className="text-2xl">🐢</span>
              <input type="range" min="40" max="160" value={bpm} onChange={e=>setBpm(Number(e.target.value))} style={{width:380}}/>

            <div className="flex items-center gap-3">

              <span className="t-sm text-indigo-700 truncate">{feedback||STAGE_INFO[stage].short}</span>
            </div>

              <span className="text-2xl">🐢</span>
              <input type="range" min="50" max="150" value={bpm} onChange={e=>setBpm(Number(e.target.value))}/>

          </div>
          {favorites.length>0 && (
            <div className="card p-3 w-[700px] fade-in" style={{background:'rgba(254,243,199,0.95)', borderColor:'#fbbf24'}}>
              <div className="t-mid text-amber-900 mb-1 text-center">
                💭 <b>{getInstObj(favorites[0])?.name}</b>이(가) 왜 마음에 들었나요?
              </div>
              <input type="text" value={favoriteWhy}
                onChange={e=>setFavoriteWhy(e.target.value)}
                placeholder="예: 소리가 맑아서 / 흔드는 느낌이 좋아서 / 통통 튀어서..."
                className="w-full t-mid rounded-2xl border-2 border-amber-300 px-4 py-2 outline-none focus:border-amber-500"/>
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={favorites.length===0}
            onClick={()=>setView('pair')}>
            {favorites.length===0?'하나 이상 골라요':'어울리는 짝꿍 찾기 →'}
          </button>
        </div>
      )}

      {/* 어울리는 짝꿍 */}
      {view==='pair' && (
        <div className="h-full flex flex-col items-center justify-center gap-3 fade-in">
          <BackBtn/>
          <h2 className="t-huge text-white" style={{textShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>🎶 두 악기를 함께 들어봐요</h2>
          <p className="t-mid text-white/90" style={{textShadow:'0 1px 4px rgba(0,0,0,0.2)'}}>
            🔬 <b>선택 → 들어보기 → 다른 조합 시도</b> — 진짜 탐구!
          </p>
          <div className="flex gap-5 items-center">
            <div className="flex flex-col items-center gap-1">
              <div className="t-mid text-white font-bold" style={{textShadow:'0 1px 3px rgba(0,0,0,0.3)'}}>악기 A</div>
              <div className="flex flex-col gap-1">
                {[...INSTRUMENTS,
                  ...(customSounds.my1?.url?[getInstObj('my1')]:[]),
                  ...(customSounds.my2?.url?[getInstObj('my2')]:[])].map(inst=>(
                  <button key={inst.id} onClick={()=>{ setPairA(inst.id); trigger(inst.id); }}
                    className={"btn flex items-center gap-2 px-3 py-1 t-sm "+
                      (pairA===inst.id?'text-white':'bg-white text-slate-600')}
                    style={{background:pairA===inst.id?inst.color:undefined}}>
                    <InstIcon type={inst.id} size={28}/>{inst.name}
                  </button>
                ))}
              </div>
            </div>
            <div className="text-5xl text-white">＋</div>
            <div className="flex flex-col items-center gap-1">
              <div className="t-mid text-white font-bold" style={{textShadow:'0 1px 3px rgba(0,0,0,0.3)'}}>악기 B</div>
              <div className="flex flex-col gap-1">
                {[...INSTRUMENTS,
                  ...(customSounds.my1?.url?[getInstObj('my1')]:[]),
                  ...(customSounds.my2?.url?[getInstObj('my2')]:[])].map(inst=>(
                  <button key={inst.id} onClick={()=>{ setPairB(inst.id); trigger(inst.id); }}
                    className={"btn flex items-center gap-2 px-3 py-1 t-sm "+
                      (pairB===inst.id?'text-white':'bg-white text-slate-600')}
                    style={{background:pairB===inst.id?inst.color:undefined}}>
                    <InstIcon type={inst.id} size={28}/>{inst.name}
                  </button>
                ))}
              </div>
            </div>
          </div>
          {pairA && pairB && (
            <div className="card p-3 w-[760px] text-center fade-in">
              <div className="t-mid text-indigo-700 mb-2">{pairingDescription()}</div>
              <button onClick={()=>playPair(pairA,pairB)} className="btn bg-emerald-500 text-white px-7 py-3 t-mid">
                ▶ 함께 들어보기
              </button>
              {pairTried.length>0 && (
                <div className="t-sm text-slate-500 mt-2">
                  🔬 시도한 짝꿍: <b>{pairTried.length}개</b>
                  {pairTried.length>=2 && ' — 멋진 탐구가! 마음에 드는 짝꿍을 정해요'}
                </div>
              )}
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={!pairA||!pairB||pairTried.length===0}
            onClick={()=>goStage(3)}>
            {!pairA||!pairB?'두 악기를 골라요':
             pairTried.length===0?'먼저 ▶ 함께 들어봐요':
             '이 짝꿍으로 자유롭게 →'}
          </button>
        </div>
      )}

      {/* 배움 정리 */}
      {view==='reflection' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-4 fade-in">
          <BackBtn/>
          <h2 className="t-huge text-indigo-700">🎯 처음 목표, 어디까지 왔나요?</h2>
          <p className="t-mid text-slate-500">시작할 때 본 목표를 다시 확인해요. 할 수 있게 된 것에 체크!</p>
          <div className="card p-6 w-[820px] flex flex-col gap-3">
            {mode.reflectionItems.map((item,i)=>{
              const on = reflection.includes(item);
              return (
                <button key={i}
                  onClick={()=>setReflection(on?reflection.filter(x=>x!==item):[...reflection,item])}
                  className={"btn flex items-center gap-3 px-5 py-4 t-mid text-left "+
                    (on?'bg-emerald-400 text-white':'bg-white text-slate-700')}>
                  <span className="text-3xl">{on?'✅':'⬜'}</span>{item}
                </button>
              );
            })}
          </div>
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={reflection.length===0}
            onClick={()=>setView('postrecord')}>
            {reflection.length===0?'하나 이상 골라요':'다음 발표 →'}
          </button>
        </div>
      )}

      {/* 사후 녹음 */}
      {view==='postrecord' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-5 fade-in">
          <BackBtn/>
          <div className="float text-6xl">🎤</div>
          <RecorderUI title={mode.postTitle(situation)}
            examples={mode.postExamples}
            onComplete={async(r)=>{
              setSession(p=>({...p,postRecordText:r.text,postHelp:r.helpUsed,postSticker:r.sticker}));
              if(r.b64){
                const res=await api.saveRecording({studentName:student.name,phase:'post',audioBase64:r.b64,mimeType:'audio/webm'});
                if(res.ok) setSession(p=>({...p,postRecordUrl:res.fileUrl}));
              }
              setView('eval');
            }}/>
        </div>
      )}

      {/* 자기 평가 */}
      {view==='eval' && (
        <div className="h-full flex flex-col items-center justify-center gap-5 fade-in">
          <BackBtn/>
          <h2 className="t-huge text-indigo-700">⭐ 오늘 활동, 나에게 별 몇 개?</h2>
          <p className="t-mid text-slate-500">스스로에게 별을 주세요</p>
          <div className="flex gap-3">
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>setSession(p=>({...p,selfScore:n}))}
                className={"text-7xl transition-transform "+
                  ((session.selfScore||0)>=n?'pop':'opacity-40 hover:opacity-80 hover:scale-110')}>⭐</button>
            ))}
          </div>
          <div className="card p-4 px-7 t-mid text-indigo-700">
            {session.selfScore?
              (session.selfScore>=4?'정말 멋졌어요! 🎉':
               session.selfScore>=3?'잘 했어요! 👍':
               '다음엔 더 잘 할 수 있어요!') : '별을 골라요'}
          </div>
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={!session.selfScore}
            onClick={async()=>{ await saveAll(); confetti(); fx.yay(); setView('cert'); }}>
            {session.selfScore?'수료증 받기! 🏆':'별점을 골라요'}
          </button>
        </div>
      )}

      {/* 수료증 */}
      {view==='cert' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-4 fade-in">
          <div className="card p-7 w-[940px]" style={{border:'8px double '+mode.color, background:'rgba(255,255,255,0.97)'}}>
            <div className="text-center">
              <div className="text-7xl mb-1">{mode.characterEmoji}</div>
              <div className="t-title" style={{color:mode.color, lineHeight:1}}>{mode.character} 임명장</div>
              <div className="t-sm text-slate-400 mt-1">🏆 {mode.label} · "{mode.motto}"</div>
            </div>
            <div className="my-4 text-center">
              <div className="t-mid text-slate-500">탐험가</div>
              <div className="t-huge mt-1" style={{color:mode.color}}>{student?.name} 님</div>
            </div>
            <div className="t-sm text-slate-700 text-center leading-relaxed mb-3 px-4">
              {mode.certBody(situation)}
            </div>

            {/* 학생 박자 미니 그리드 + 정보 2단 */}
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div className="rounded-2xl p-3" style={{background:mode.color+'15', border:'2px solid '+mode.color+'40'}}>
                <div className="t-xs text-slate-600 mb-2 font-bold">🎵 내가 만든 박자</div>
                <div className="flex flex-col gap-1">
                  {grid.map((row,r)=>(
                    <div key={r} className="flex justify-center gap-1">
                      {row.map((c,i)=>{
                        const inst = c ? getInstObj(c) : null;
                        return <div key={i}
                          style={{
                            width:24, height:24, borderRadius:5,
                            background: inst ? inst.color : 'rgba(255,255,255,0.5)',
                            border: inst ? '2px solid white' : '1.5px dashed #cbd5e1'
                          }}/>;
                      })}
                    </div>
                  ))}
                </div>
              </div>
              <div className="rounded-2xl p-3 flex flex-col gap-1" style={{background:'rgba(254,243,199,0.6)', border:'2px solid #fbbf24'}}>
                <div className="t-xs text-slate-600 font-bold mb-1">🎯 내가 정한 것</div>
                {situation && <div className="t-xs">🎬 장면: <b>{situation.name}</b></div>}
                <div className="t-xs">🐢 빠르기: <b>{bpm} BPM</b></div>
                {favorites.length>0 && <div className="t-xs">💖 좋아한 악기: <b>{favorites.map(id=>getInstObj(id)?.name).join(', ')}</b></div>}
                {pairA && pairB && <div className="t-xs">🎶 어울리는 짝꿍: <b>{getInstObj(pairA).name} + {getInstObj(pairB).name}</b></div>}
                {(customSounds.my1?.url||customSounds.my2?.url) && <div className="t-xs">🌿 내 소리: <b>{[customSounds.my1?.name,customSounds.my2?.name].filter(Boolean).join(', ')}</b></div>}
              </div>
            </div>

            {reflection.length>0 && (
              <div className="rounded-2xl p-3 mb-3" style={{background:'rgba(254,243,199,0.85)', border:'2px solid #fbbf24'}}>
                <div className="t-xs text-amber-900 mb-1 font-bold">🎯 오늘 우리가 이뤄낸 목표</div>
                <div className="flex flex-col gap-0">
                  {reflection.map((item,i)=>(
                    <div key={i} className="t-xs text-amber-800">✓ {item}</div>
                  ))}
                </div>
              </div>
            )}

            <div className="flex justify-center gap-1 mb-2">
              {Array.from({length:session.selfScore||0}).map((_,i)=><span key={i} className="text-3xl">⭐</span>)}
            </div>
            <div className="t-xs text-slate-400 text-center">{new Date().toLocaleDateString('ko-KR')}</div>
          </div>
          <div className="flex gap-3 flex-wrap justify-center">
            {student?.group && (
              <button className="btn bg-pink-500 text-white px-6 py-3 t-mid"
                disabled={loadingGroup}
                onClick={async()=>{
                  setLoadingGroup(true);
                  const res = await api.request('getGroupWorks', {group: student.group});
                  setLoadingGroup(false);
                  if(res.ok && res.works){
                    setGroupWorks(res.works);
                    setView('groupShow');
                  } else {
                    alert('모둠 작품을 가져올 수 없어요. 잠시 후 다시 시도해주세요.');
                  }
                }}>
                {loadingGroup?'불러오는 중...':'🎶 같은 모둠 친구 작품 듣기'}
              </button>
            )}
            <button className="btn bg-emerald-500 text-white px-8 py-3 t-big"
              onClick={()=>{
                setView('login'); setStudent(null); setMode(null); setSituation(null);
                setStage(1); setTimeSig(4); setGrid(newGrid(8));
                setMusicTakes([]); setMusicHeard(false); setFinalWork(null);
                setFavorites([]); setFavoriteWhy(''); setPairA(null); setPairB(null); setPairTried([]);
                setChosenRule(null); setReflection([]); setSession({}); setGroupWorks([]);
                setCustomSounds({my1:null,my2:null}); setPreviewed({my1:false,my2:false});
                Object.values(players.current).forEach(p=>{ if(p){ try{p.dispose();}catch(e){} } });
                players.current={my1:null,my2:null};
              }}>🏠 처음으로</button>
          </div>
        </div>
      )}

      {/* 같은 모둠 친구 작품 듣기 */}
      {view==='groupShow' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-4 fade-in p-6">
          <h2 className="t-huge text-white" style={{textShadow:'0 2px 8px rgba(0,0,0,0.3)'}}>🎶 우리 모둠 친구들의 음악</h2>
          <p className="t-mid text-white/90" style={{textShadow:'0 1px 4px rgba(0,0,0,0.2)'}}>
            👂 {student?.group} 친구들의 작품을 들어봐요
          </p>
          {groupWorks.length===0 ? (
            <div className="card p-8 w-[700px] text-center">
              <div className="text-6xl mb-3">🌱</div>
              <div className="t-mid text-slate-600">
                아직 모둠 친구들 작품이 저장되지 않았어요.<br/>
                친구들이 활동을 마치고 [별점 → 수료증]까지 가야 들어볼 수 있어요!
              </div>
            </div>
          ) : (
            <div className="card p-4 w-[860px] max-h-[460px] overflow-y-auto">
              <div className="flex flex-col gap-2">
                {groupWorks.map((w,i)=>(
                  <div key={i} className="flex items-center gap-3 p-3 rounded-2xl"
                    style={{background: w.name===student?.name?'rgba(254,243,199,0.6)':'rgba(241,245,249,0.85)'}}>
                    <div className="text-3xl">{w.name===student?.name?'⭐':'👤'}</div>
                    <div className="flex-1">
                      <div className="t-mid font-bold text-slate-700">
                        {w.name} {w.name===student?.name && <span className="t-xs text-amber-600">(나)</span>}
                      </div>
                      <div className="t-xs text-slate-500">{w.mode} · {w.situation}</div>
                    </div>
                    <a href={w.musicUrl} target="_blank" rel="noopener"
                      className="btn bg-violet-500 text-white px-4 py-2 t-sm no-underline">
                      ▶ 새 탭에서 듣기
                    </a>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-10 py-3"
            onClick={()=>setView('cert')}>← 수료증으로 돌아가기</button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
