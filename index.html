              <button onClick={playJoined}
                className={"btn px-6 py-3 t-mid text-white "+(!musicHeard?'bg-amber-500 animate-pulse':'bg-violet-400')}>
                {!musicHeard?'먼저 ▶ 내 녹음 듣기':'▶ 다시 듣기'} ({musicTakes.length})
              </button>
            )}
            {stage===3 && musicTakes.length>=2 && !finalWork && (
              <button onClick={makeFinalWork} disabled={building}
                className="btn px-6 py-3 t-mid bg-pink-500 text-white">
                {building?'🎬 만드는 중...':'🎬 최종 작품 만들기'}
              </button>
            )}
            {stage===3 && finalWork && (
              <button onClick={downloadFinal}
                className="btn px-6 py-3 t-mid bg-emerald-500 text-white">⬇️ 최종 작품 받기</button>
            )}
            <button onClick={()=>setGrid(newGrid(COLS))}
              className="btn px-6 py-3 t-mid bg-amber-300 text-amber-900">🔁 다 지우기</button>
            {stage===1 && <button onClick={()=>setView('rule')}
              className="btn px-8 py-3 t-big bg-indigo-600 text-white">규칙 찾기 →</button>}
            {stage===2 && <button onClick={()=>setView('preference')}
              className="btn px-8 py-3 t-big bg-indigo-600 text-white">좋아하는 악기 →</button>}
            {stage===3 && <button onClick={()=>setView('reflection')}
              disabled={musicTakes.length===0 || !musicHeard}
              className="btn px-8 py-3 t-big bg-indigo-600 text-white">
              {musicTakes.length===0?'먼저 음악 녹음하기':
               !musicHeard?'먼저 ▶ 내 녹음 들어봐요':
               '배움 정리 →'}
            </button>}
          </div>

          {showGuide && <GuideModal title={STAGE_INFO[stage].title}
            short={STAGE_INFO[stage].short} steps={STAGE_INFO[stage].steps}
            onClose={()=>setShowGuide(false)}/>}
        </div>
        );
      })()}

      {/* 규칙 찾기 */}
      {view==='rule' && (
        <div className="h-full flex flex-col items-center justify-center gap-3 fade-in pt-12">
          <BackBtn/>
          <CharBubble mode={mode} text="🥁 박자 모양을 골라봐!" big/>
          <div className="readable-light t-mid">
            먼저 손뼉으로 따라 쳐 보고, 들어본 다음 골라요
          </div>
          <div className="flex gap-3 flex-wrap justify-center">
            {getRulePatterns(timeSig).map(rp=>(
              <RuleCard key={rp.id} rp={rp} bpm={bpm}
                selected={chosenRule===rp.id}
                onSelect={()=>setChosenRule(rp.id)}
                onListen={(r)=>playPreset(r.pattern,'drum',bpm)}/>
            ))}
          </div>
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4 animate-pulse"
            disabled={!chosenRule}
            onClick={()=>goStage(2,{applyRule:chosenRule})}>
            {chosenRule?'다음! →':'박자 모양 골라봐'}
          </button>
        </div>
      )}

      {/* 좋아하는 악기 */}
      {view==='preference' && (
        <div className="h-full flex flex-col items-center justify-center gap-3 fade-in pt-12">
          <BackBtn/>
          <CharBubble mode={mode} text="💖 가장 마음에 든 악기를 골라봐!"/>
          <div className="readable-light t-mid">최대 2개까지 가능</div>
          <div className="flex gap-4 flex-wrap justify-center">
            {[...INSTRUMENTS,
              ...(hasSnd(customSounds.my1)?[getInstObj('my1')]:[]),
              ...(hasSnd(customSounds.my2)?[getInstObj('my2')]:[])].map(inst=>{
              const rank = favRank(inst.id);
              return (
                <button key={inst.id} onClick={()=>{toggleFavorite(inst.id);}}
                  className={"card p-4 w-[180px] flex flex-col items-center gap-2 transition-transform "+
                    (rank?'scale-110 ring-8 ring-pink-300':'hover:scale-105')}
                  style={{background:rank?inst.color:undefined}}>
                  <InstIcon type={inst.id} size={56} emoji={inst.emoji}/>
                  <div className={"t-mid "+(rank?'text-white':'text-indigo-700')}>{inst.name}</div>
                  <div className={"t-xs "+(rank?'text-white/90':'text-slate-500')}>{inst.timbre}</div>
                  {rank && <div className="bg-white text-pink-500 rounded-full px-3 py-1 t-sm font-bold">{rank}</div>}
                </button>
              );
            })}
          </div>
          {favorites.length>0 && (
            <div className="card p-3 w-[700px] fade-in" style={{background:'rgba(254,243,199,0.95)', borderColor:'#fbbf24'}}>
              <div className="t-mid text-amber-900 mb-1 text-center">
                💭 <b>{getInstObj(favorites[0])?.name}</b>이(가) 왜 좋아? <span className="t-xs text-amber-700">(생략 가능)</span>
              </div>
              <input type="text" value={favoriteWhy}
                onChange={e=>setFavoriteWhy(e.target.value)}
                placeholder="예: 소리가 맑아서 / 흔드는 게 좋아서 / 통통 튀어서..."
                className="w-full t-mid rounded-2xl border-2 border-amber-300 px-4 py-2 outline-none focus:border-amber-500"/>
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4 animate-pulse"
            disabled={favorites.length===0}
            onClick={()=>setView('pair')}>
            {favorites.length===0?'하나 이상 골라봐':'다음! →'}
          </button>
        </div>
      )}

      {/* 어울리는 짝꿍 */}
      {view==='pair' && (
        <div className="h-full flex flex-col items-center justify-center gap-3 fade-in pt-12">
          <BackBtn/>
          <CharBubble mode={mode} text="🎶 두 악기를 골라서 같이 들어봐!" big/>
          <div className="readable-light t-mid">
            여러 조합을 들어보고 마음에 드는 짝꿍을 정해봐
          </div>
          <div className="flex gap-5 items-center">
            <div className="flex flex-col items-center gap-1">
              <div className="card px-4 py-1 t-mid font-bold" style={{color:'#475569'}}>악기 A</div>
              <div className="flex flex-col gap-1">
                {[...INSTRUMENTS,
                  ...(hasSnd(customSounds.my1)?[getInstObj('my1')]:[]),
                  ...(hasSnd(customSounds.my2)?[getInstObj('my2')]:[])].map(inst=>(
                  <button key={inst.id} onClick={()=>{ setPairA(inst.id); trigger(inst.id); }}
                    className={"btn flex items-center gap-2 px-3 py-1 t-sm "+
                      (pairA===inst.id?'text-white':'bg-white text-slate-600')}
                    style={{background:pairA===inst.id?inst.color:undefined}}>
                    <InstIcon type={inst.id} size={28} emoji={inst.emoji}/>{inst.name}
                  </button>
                ))}
              </div>
            </div>
            <div className="text-5xl text-white">＋</div>
            <div className="flex flex-col items-center gap-1">
              <div className="card px-4 py-1 t-mid font-bold" style={{color:'#475569'}}>악기 B</div>
              <div className="flex flex-col gap-1">
                {[...INSTRUMENTS,
                  ...(hasSnd(customSounds.my1)?[getInstObj('my1')]:[]),
                  ...(hasSnd(customSounds.my2)?[getInstObj('my2')]:[])].map(inst=>(
                  <button key={inst.id} onClick={()=>{ setPairB(inst.id); trigger(inst.id); }}
                    className={"btn flex items-center gap-2 px-3 py-1 t-sm "+
                      (pairB===inst.id?'text-white':'bg-white text-slate-600')}
                    style={{background:pairB===inst.id?inst.color:undefined}}>
                    <InstIcon type={inst.id} size={28} emoji={inst.emoji}/>{inst.name}
                  </button>
                ))}
              </div>
            </div>
          </div>
          {pairA && pairB && (
            <div className="card p-3 w-[760px] text-center fade-in">
              <button onClick={()=>playPair(pairA,pairB)} className="btn bg-emerald-500 text-white px-7 py-3 t-mid">
                ▶ 함께 들어보기
              </button>
              {pairTried.length>0 && (
                <div className="t-sm text-slate-500 mt-2">
                  들어본 짝꿍: <b>{pairTried.length}개</b>
                </div>
              )}
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4 animate-pulse"
            disabled={!pairA||!pairB||pairTried.length===0}
            onClick={()=>goStage(3)}>
            {!pairA||!pairB?'두 악기를 골라봐':
             pairTried.length===0?'먼저 ▶ 함께 들어봐':
             '다음! →'}
          </button>
        </div>
      )}

      {/* 배움 정리 */}
      {view==='reflection' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-4 fade-in">
          <BackBtn/>
          <h2 className="t-huge text-indigo-700">🎯 처음 목표, 어디까지 왔나요?</h2>
          <p className="t-mid text-slate-500">시작할 때 본 목표를 다시 확인해요. 할 수 있게 된 것에 체크!</p>
          <div className="card p-6 w-[820px] flex flex-col gap-3">
            {mode.reflectionItems.map((item,i)=>{
              const on = reflection.includes(item);
              return (
                <button key={i}
                  onClick={()=>setReflection(on?reflection.filter(x=>x!==item):[...reflection,item])}
                  className={"btn flex items-center gap-3 px-5 py-4 t-mid text-left "+
                    (on?'bg-emerald-400 text-white':'bg-white text-slate-700')}>
                  <span className="text-3xl">{on?'✅':'⬜'}</span>{item}
                </button>
              );
            })}
          </div>
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={reflection.length===0}
            onClick={()=>setView('postrecord')}>
            {reflection.length===0?'하나 이상 골라요':'다음 발표 →'}
          </button>
        </div>
      )}

      {/* 사후 녹음 */}
      {view==='postrecord' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-5 fade-in">
          <BackBtn/>
          <div className="float text-6xl">🎤</div>
          <RecorderUI title={mode.postTitle(situation)}
            examples={mode.postExamples}
            onComplete={async(r)=>{
              setSession(p=>({...p,postRecordText:r.text,postHelp:r.helpUsed,postSticker:r.sticker}));
              if(r.b64){
                const res=await api.saveRecording({studentName:student.name,phase:'post',audioBase64:r.b64,mimeType:'audio/webm'});
                if(res.ok) setSession(p=>({...p,postRecordUrl:res.fileUrl}));
              }
              setView('eval');
            }}/>
        </div>
      )}

      {/* 자기 평가 */}
      {view==='eval' && (
        <div className="h-full flex flex-col items-center justify-center gap-5 fade-in">
          <BackBtn/>
          <h2 className="t-huge text-indigo-700">⭐ 오늘 활동, 나에게 별 몇 개?</h2>
          <p className="t-mid text-slate-500">스스로에게 별을 주세요</p>
          <div className="flex gap-3">
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>setSession(p=>({...p,selfScore:n}))}
                className={"text-7xl transition-transform "+
                  ((session.selfScore||0)>=n?'pop':'opacity-40 hover:opacity-80 hover:scale-110')}>⭐</button>
            ))}
          </div>
          <div className="card p-4 px-7 t-mid text-indigo-700">
            {session.selfScore?
              (session.selfScore>=4?'정말 멋졌어요! 🎉':
               session.selfScore>=3?'잘 했어요! 👍':
               '다음엔 더 잘 할 수 있어요!') : '별을 골라요'}
          </div>
          <button className="btn bg-indigo-600 text-white t-big px-12 py-4"
            disabled={!session.selfScore}
            onClick={async()=>{ await saveAll(); if(student?.name) clearLocalSession(student.name); confetti(); fx.yay(); setView('cert'); }}>
            {session.selfScore?'수료증 받기! 🏆':'별점을 골라요'}
          </button>
        </div>
      )}

      {/* 수료증 — 학습 결과 페이지 (KPI + 격려 + 박자 그리드) */}
      {view==='cert' && mode && (() => {
        const stats = computeStats();
        // 격려 메시지 — 활동 개수 기반 (등급/순위 아님, 활동 모습 격려)
        let cheer, cheerCls, cheerEm;
        if(stats.activities >= 7){ cheer='정말 멋진 탐험이었어요!'; cheerCls='best'; cheerEm='🏆'; }
        else if(stats.activities >= 5){ cheer='차근차근 잘 해냈어요!'; cheerCls='good'; cheerEm='💪'; }
        else if(stats.activities >= 3){ cheer='도전한 마음이 멋져요!'; cheerCls='warm'; cheerEm='🌱'; }
        else { cheer='시작이 가장 멋진 일이에요!'; cheerCls='warm'; cheerEm='✨'; }
        // 도넛 색 — 모드 색 단일 (등급 비교 X)
        const rateColor = mode.color;
        const circumference = 2*Math.PI*32;
        const offset = circumference * (1 - stats.completionRate/100);

        return (
          <div className="h-full flex flex-col items-center fade-in" style={{justifyContent:'center', gap:8}}>

            {/* 수료증 본체 — 1-2학년용 넓고 시원한 카드 (cheer는 카드 안으로 통합) */}
            <div className="card w-[1080px]" style={{padding:'14px 20px', border:'7px double '+mode.color, background:'rgba(255,255,255,0.97)'}}>

              {/* 헤더 — 격려 chip을 카드 헤더 위에 인라인 */}
              <div className="text-center" style={{display:'flex', flexDirection:'column', alignItems:'center', gap:2}}>
                <div className={"cheer-chip-inline "+cheerCls}>
                  <span style={{fontSize:22}}>{cheerEm}</span>
                  <span>{cheer}</span>
                </div>
                <div style={{fontSize:36, lineHeight:1}}>{mode.characterEmoji}</div>
                <div className="t-title" style={{color:mode.color, lineHeight:1, fontSize:28}}>{mode.character} 임명장</div>
                <div className="t-sm text-slate-400" style={{fontSize:12}}>🏆 {mode.label} · "{mode.motto}"</div>
                <div style={{marginTop:4}}>
                  <span className="t-mid text-slate-500" style={{fontSize:14}}>탐험가 </span>
                  <span style={{color:mode.color, fontSize:24, lineHeight:1, fontWeight:'bold'}}>{student?.name}</span>
                  <span className="t-mid text-slate-500" style={{fontSize:14}}> 님</span>
                </div>
              </div>

              {/* KPI 4셀 — 더 컴팩트 */}
              <div className="grid grid-cols-4 gap-2" style={{marginTop:10, marginBottom:8}}>
                {/* 1. 활동 완성도 도넛 */}
                <div className="kpi-cell">
                  <div className="kpi-label">🎯 활동 완성도</div>
                  <div className="donut-wrap">
                    <svg className="donut-svg" viewBox="0 0 80 80">
                      <circle className="donut-track" cx="40" cy="40" r="32"/>
                      <circle className="donut-fill" cx="40" cy="40" r="32"
                        stroke={rateColor}
                        strokeDasharray={circumference}
                        strokeDashoffset={offset}/>
                    </svg>
                    <div className="donut-label">
                      <div className="donut-pct" style={{color:rateColor}}>{stats.completionRate}<span style={{fontSize:12}}>%</span></div>
                      <div className="donut-frac">{stats.activities}/{stats.totalActivities}</div>
                    </div>
                  </div>
                </div>

                {/* 2. 진행 단계 — 이모지 도트 */}
                <div className="kpi-cell">
                  <div className="kpi-label">📈 활동 단계</div>
                  <div className="kpi-big" style={{color:mode.color, fontSize:26}}>{stats.stepsDone}<span style={{fontSize:14, color:'#94a3b8'}}>/{stats.steps.length}</span></div>
                  <div className="flex gap-1" style={{flexWrap:'wrap', justifyContent:'center', maxWidth:150}}>
                    {stats.steps.map((s,i)=>(
                      <div key={i} title={s.label + (s.done?' ✓':' (아직)')}
                        style={{
                          width:24, height:24, borderRadius:6,
                          background: s.done ? 'linear-gradient(135deg,#86efac,#34d399)' : '#f1f5f9',
                          border: s.done ? '2px solid #15803d' : '2px solid #cbd5e1',
                          fontSize:13, textAlign:'center',
                          display:'flex', alignItems:'center', justifyContent:'center',
                          opacity: s.done ? 1 : 0.4
                        }}>
                        {s.emoji}
                      </div>
                    ))}
                  </div>
                </div>

                {/* 3. 학습 시간 */}
                <div className="kpi-cell">
                  <div className="kpi-label">⏱️ 학습 시간</div>
                  <div className="kpi-big" style={{color:mode.color, fontSize:32}}>{stats.studyMin}<span style={{fontSize:16}}>분</span></div>
                  <div className="kpi-small">집중해서 활동했어요</div>
                </div>

                {/* 4. 칭찬 스티커 */}
                <div className="kpi-cell">
                  <div className="kpi-label">⭐ 받은 별</div>
                  <div className="flex" style={{fontSize:22, gap:0}}>
                    {Array.from({length:session.selfScore||0}).map((_,i)=><span key={i}>⭐</span>)}
                  </div>
                  {(session.preSticker || session.postSticker) && (
                    <div className="flex gap-1" style={{fontSize:18}}>
                      {session.preSticker && <span>{session.preSticker}</span>}
                      {session.postSticker && <span>{session.postSticker}</span>}
                    </div>
                  )}
                  <div className="kpi-small">스스로 준 칭찬</div>
                </div>
              </div>

              {/* 내가 만든 박자 + 내가 정한 것 */}
              <div className="grid grid-cols-2 gap-2" style={{marginBottom:6}}>
                <div className="rounded-2xl" style={{padding:10, background:mode.color+'15', border:'2px solid '+mode.color+'55'}}>
                  <div className="text-slate-700 font-bold" style={{fontSize:14, marginBottom:4}}>
                    🎵 내가 만든 박자 <span style={{color:getTSInfo(timeSig).color}}>({getTSInfo(timeSig).emoji} {getTSInfo(timeSig).label})</span>
                  </div>
                  <div className="flex flex-col" style={{gap:3}}>
                    {grid.map((row,r)=>(
                      <div key={r} className="flex justify-center" style={{gap:3}}>
                        {row.map((c,i)=>{
                          const inst = c ? getInstObj(c) : null;
                          const isAccent = getTSInfo(timeSig).accent[i]===1;
                          return <div key={i} className="beat-mini-cell"
                            style={{
                              background: inst ? inst.color : (isAccent?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.45)'),
                              border: inst ? '2px solid white' : (isAccent?'2px solid '+getTSInfo(timeSig).color+'66':'2px dashed #cbd5e1'),
                              boxShadow: inst ? '0 2px 4px rgba(0,0,0,0.12)' : 'none'
                            }}/>;
                        })}
                      </div>
                    ))}
                  </div>
                </div>
                <div className="rounded-2xl flex flex-col" style={{padding:10, gap:3, background:'rgba(254,243,199,0.65)', border:'2px solid #fbbf24'}}>
                  <div className="text-slate-700 font-bold" style={{fontSize:14, marginBottom:2}}>🎯 내가 정한 것</div>
                  {situation && <div className="info-line">🎬 장면: <b>{situation.name}</b></div>}
                  <div className="info-line">🐢 빠르기: <b>{bpm} BPM</b></div>
                  <div className="info-line">{getTSInfo(timeSig).emoji} 박자: <b>{getTSInfo(timeSig).label}</b></div>
                  {favorites.length>0 && <div className="info-line">💖 좋아한 악기: <b>{favorites.map(id=>getInstObj(id)?.name).join(', ')}</b></div>}
                  {pairA && pairB && <div className="info-line">🎶 어울리는 짝꿍: <b>{getInstObj(pairA).name} + {getInstObj(pairB).name}</b></div>}
                  {(hasSnd(customSounds.my1)||hasSnd(customSounds.my2)) && <div className="info-line">🌿 내 소리: <b>{
                    [customSounds.my1, customSounds.my2].filter(hasSnd)
                      .map(cs=>(cs.emoji?cs.emoji+' ':'')+cs.name).join(', ')
                  }</b></div>}
                </div>
              </div>

              {/* 인사이트 — 학생이 이뤄낸 목표 */}
              {reflection.length>0 && (
                <div className="rounded-2xl" style={{padding:10, background:'linear-gradient(135deg,#ecfdf5,#d1fae5)', border:'2px solid #34d399'}}>
                  <div className="text-emerald-900 font-bold" style={{fontSize:14, marginBottom:3}}>🎯 오늘 우리가 이뤄낸 목표</div>
                  <div className="flex flex-col" style={{gap:1}}>
                    {reflection.map((item,i)=>(
                      <div key={i} className="text-emerald-800" style={{fontSize:13, lineHeight:1.3}}>✓ {item}</div>
                    ))}
                  </div>
                </div>
              )}

              <div className="text-slate-400 text-center" style={{fontSize:11, marginTop:6}}>{new Date().toLocaleDateString('ko-KR')} · {mode.certBody(situation)}</div>
            </div>

            <div className="flex gap-3 flex-wrap justify-center">
              {student?.group && (
                <button className="btn bg-pink-500 text-white px-6 py-3 t-mid"
                  disabled={loadingGroup}
                  onClick={async()=>{
                    setLoadingGroup(true);
                    const res = await api.request('getGroupWorks', {group: student.group});
                    setLoadingGroup(false);
                    if(res.ok && res.works){
                      setGroupWorks(res.works);
                      setView('groupShow');
                    } else {
                      alert('모둠 작품을 가져올 수 없어요. 잠시 후 다시 시도해주세요.');
                    }
                  }}>
                  {loadingGroup?'불러오는 중...':'🎶 같은 모둠 친구 작품 듣기'}
                </button>
              )}
              <button className="btn bg-emerald-500 text-white px-8 py-3 t-big"
                onClick={()=>{
                  setView('login'); setStudent(null); setMode(null); setSituation(null);
                  setStage(1); setTimeSig(4); setBeatHeard({}); setGrid(newGrid(8));
                  setMusicTakes([]); setMusicHeard(false); setFinalWork(null);
                  setFavorites([]); setFavoriteWhy(''); setPairA(null); setPairB(null); setPairTried([]);
                  setChosenRule(null); setReflection([]); setSession({}); setGroupWorks([]);
                  setCustomSounds({my1:null,my2:null}); setPreviewed({my1:false,my2:false});
                  Object.values(players.current).forEach(p=>{ if(p){ try{p.dispose();}catch(e){} } });
                  players.current={my1:null,my2:null};
                }}>🏠 처음으로</button>
            </div>
          </div>
        );
      })()}

      {/* 같은 모둠 친구 작품 듣기 */}
      {view==='groupShow' && mode && (
        <div className="h-full flex flex-col items-center justify-center gap-4 fade-in p-6">
          <div className="card px-8 py-3">
            <h2 className="t-huge" style={{color:mode.color}}>🎶 우리 모둠 친구들의 음악</h2>
          </div>
          <div className="readable-light t-mid">
            👂 {student?.group} 친구들의 작품을 들어봐요
          </div>
          {groupWorks.length===0 ? (
            <div className="card p-8 w-[700px] text-center">
              <div className="text-6xl mb-3">🌱</div>
              <div className="t-mid text-slate-600">
                아직 모둠 친구들 작품이 저장되지 않았어요.<br/>
                친구들이 활동을 마치고 [별점 → 수료증]까지 가야 들어볼 수 있어요!
              </div>
            </div>
          ) : (
            <div className="card p-4 w-[860px] max-h-[460px] overflow-y-auto">
              <div className="flex flex-col gap-2">
                {groupWorks.map((w,i)=>(
                  <div key={i} className="flex items-center gap-3 p-3 rounded-2xl"
                    style={{background: w.name===student?.name?'rgba(254,243,199,0.6)':'rgba(241,245,249,0.85)'}}>
                    <div className="text-3xl">{w.name===student?.name?'⭐':'👤'}</div>
                    <div className="flex-1">
                      <div className="t-mid font-bold text-slate-700">
                        {w.name} {w.name===student?.name && <span className="t-xs text-amber-600">(나)</span>}
                      </div>
                      <div className="t-xs text-slate-500">{w.mode} · {w.situation}</div>
                    </div>
                    <a href={w.musicUrl} target="_blank" rel="noopener"
                      className="btn bg-violet-500 text-white px-4 py-2 t-sm no-underline">
                      ▶ 새 탭에서 듣기
                    </a>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button className="btn bg-indigo-600 text-white t-big px-10 py-3"
            onClick={()=>setView('cert')}>← 수료증으로 돌아가기</button>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
